# Rebuilds the profile card every day and whenever config.json changes. Run it by hand from the Actions tab.
# Everything about the card lives in config.json (themes, sections, heatmap snake, language weights, time zone).
name: profile-forge

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    paths: [config.json]

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: GiuseppeBellamacina/profile-forge@v1
        with:
          token: ${{ secrets.PROFILE_FORGE_TOKEN || github.token }}
          output_dir: assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile card" && git pull --rebase && git push)
