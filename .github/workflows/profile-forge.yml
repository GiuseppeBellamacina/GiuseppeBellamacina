# Generated by the profile-forge configurator.
# Rebuilds your profile card every day and whenever config.json changes. Run it by hand from the Actions tab.
name: profile-forge

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: [config.json]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: GiuseppeBellamacina/profile-forge@v1
        with:
          # Optional: add a classic PAT (read:user + repo) as the secret PROFILE_FORGE_TOKEN
          # to count private contributions. Without it the default token is used.
          token: ${{ secrets.PROFILE_FORGE_TOKEN || github.token }}
          output_dir: assets
          # Everything else lives in config.json at the root of this repo.

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile card" && git pull --rebase && git push)
